<title>Matematica · 4 ES</title>
<style>
body{margin:0;background:#fbf7ec;color:#1d1d1d;font-family:Verdana,Tahoma,Arial,sans-serif;font-size:18px;line-height:1.6}
header{background:#22314d;color:#fff;padding:18px 16px}header h1{margin:0;font-size:1.35rem}header p{margin:4px 0 0;font-size:.9rem;opacity:.85}
main{max-width:640px;margin:0 auto;padding:16px}
.it{display:block;background:#fff;border:2px solid #d9d2bf;border-radius:14px;padding:16px;margin:12px 0;text-decoration:none;color:inherit;min-height:56px}
.it b{display:block;font-size:1.1rem;color:#22314d}.it span{font-size:.9rem;color:#555}

</style></head><body><header><h1>Matematica · 4 ES</h1><p>Scegli il materiale</p></header><main><p><a class="back" href="../">← Indietro</a></p><a class="it" href="primo-scritto/"><b>Primo scritto: goniometria</b><span>Misura degli angoli, circonferenza goniometrica, seno, coseno, tangente, relazioni fondamentali</span></a></main><!--AGG--><script>
(function(){
 var B="20261007114623",t0=Date.now(),touched=false,last=0;
 ['click','keydown','touchstart'].forEach(function(e){addEventListener(e,function(){touched=true},{once:true,passive:true})});
 function banner(){
  if(document.getElementById('agg'))return;
  var d=document.createElement('div');d.id='agg';d.setAttribute('role','alert');
  d.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:99999;background:#b71c1c;color:#fff;padding:14px 16px;font:bold 18px Verdana,Arial,sans-serif;text-align:center';
  d.innerHTML='\u00c8 disponibile una versione aggiornata. <button id="aggb" style="font:inherit;margin-left:8px;padding:8px 16px;border-radius:8px;border:2px solid #fff;background:#fff;color:#b71c1c;cursor:pointer">Aggiorna</button>';
  document.body.appendChild(d);document.getElementById('aggb').onclick=function(){go(true)};
 }
 function go(){
  fetch(location.href,{cache:'reload'}).then(function(){location.reload()},function(){location.reload()});
 }
 function check(){
  if(Date.now()-last<30000)return;last=Date.now();
  fetch("../../version.json?t="+Date.now(),{cache:'no-store'}).then(function(r){return r.json()}).then(function(v){
   if(!v||!v.build||v.build===B)return;
   var tried=false;try{tried=sessionStorage.getItem('agg_'+v.build)==='1'}catch(e){}
   if(!tried&&!touched&&Date.now()-t0<10000){try{sessionStorage.setItem('agg_'+v.build,'1')}catch(e){}go()}
   else banner();
  }).catch(function(){});
 }
 check();
 document.addEventListener('visibilitychange',function(){if(!document.hidden)check()});
})();
</script><!--/AGG--></body></html>
