<rect x="226" y="20" width="588" height="56" rx="10" fill="#EEE9FC" stroke="#534AB7" stroke-width="2"/>
<text font-family="Arial" font-size="18" font-weight="700" fill="#26215C" x="520" y="42" text-anchor="middle" dominant-baseline="central">IL DAVID</text>
<text font-family="Arial" font-size="12" font-weight="normal" fill="#534AB7" x="520" y="65" text-anchor="middle" dominant-baseline="central">il David di bronzo e il David di marmo</text>
<rect x="18" y="144" width="274" height="150" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="30" cy="156" r="10" fill="#993C1D"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="156" text-anchor="middle" dominant-baseline="central">1</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#71130C" x="155" y="180" text-anchor="middle" dominant-baseline="central">IL DAVID DI BRONZO</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="202" text-anchor="middle" dominant-baseline="central">statua di Donatello alta</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="227" text-anchor="middle" dominant-baseline="central">158 cm, fatta intorno al 1440</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="252" text-anchor="middle" dominant-baseline="central">(data non documentata)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#712B13" x="155" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">capolavoro pi&#xf9; famoso di Donatello</text>
<rect x="382" y="144" width="274" height="150" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<circle cx="394" cy="156" r="10" fill="#3B6D11"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="156" text-anchor="middle" dominant-baseline="central">2</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#173404" x="519" y="180" text-anchor="middle" dominant-baseline="central">PER CHI E DOVE</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="202" text-anchor="middle" dominant-baseline="central">forse per Cosimo de&#x2019; Medici,</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="227" text-anchor="middle" dominant-baseline="central">nel cortile del Palazzo Medici;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="252" text-anchor="middle" dominant-baseline="central">oggi al Bargello (dal 1865)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#27500A" x="519" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">la committenza non &#xe8; sicura</text>
<rect x="746" y="144" width="274" height="150" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<circle cx="758" cy="156" r="10" fill="#0F6E56"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="156" text-anchor="middle" dominant-baseline="central">3</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#04342C" x="883" y="180" text-anchor="middle" dominant-baseline="central">COM&#x2019;È FATTO</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="202" text-anchor="middle" dominant-baseline="central">giovane pastore nudo, con</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="227" text-anchor="middle" dominant-baseline="central">cappello d&#x2019;alloro e stivali;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="252" text-anchor="middle" dominant-baseline="central">corpo snello, volto assorto</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#085041" x="883" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">primo nudo dopo l&#x2019;arte classica</text>
<rect x="746" y="342" width="274" height="150" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="758" cy="354" r="10" fill="#185FA5"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="354" text-anchor="middle" dominant-baseline="central">4</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#0C447C" x="883" y="378" text-anchor="middle" dominant-baseline="central">LA TESTA DI GOLIA</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="883" y="400" text-anchor="middle" dominant-baseline="central">David ha un piede sulla</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="883" y="425" text-anchor="middle" dominant-baseline="central">testa del gigante e tiene</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="883" y="450" text-anchor="middle" dominant-baseline="central">la spada di Golia</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0C447C" x="883" y="475" text-anchor="middle" dominant-baseline="central" font-style="italic">con la spada ha tagliato la testa</text>
<rect x="382" y="342" width="274" height="150" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1.5"/>
<circle cx="394" cy="354" r="10" fill="#993556"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="354" text-anchor="middle" dominant-baseline="central">5</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#4B1528" x="519" y="378" text-anchor="middle" dominant-baseline="central">DETTAGLI</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="400" text-anchor="middle" dominant-baseline="central">l&#x2019;elmo di Golia ha un&#x2019;ala;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="425" text-anchor="middle" dominant-baseline="central">il restauro (2007-2008) ha</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="450" text-anchor="middle" dominant-baseline="central">trovato tracce di doratura</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#72243E" x="519" y="475" text-anchor="middle" dominant-baseline="central" font-style="italic">doratura: spada, cappello, elmo</text>
<rect x="18" y="342" width="274" height="150" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
<circle cx="30" cy="354" r="10" fill="#854F0B"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="354" text-anchor="middle" dominant-baseline="central">6</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#412402" x="155" y="378" text-anchor="middle" dominant-baseline="central">PERCHÉ È IMPORTANTE</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="400" text-anchor="middle" dominant-baseline="central">primo nudo a tutto tondo</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="425" text-anchor="middle" dominant-baseline="central">dall&#x2019;antichit&#xe0; classica:</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="450" text-anchor="middle" dominant-baseline="central">si guarda da ogni lato</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#633806" x="155" y="475" text-anchor="middle" dominant-baseline="central" font-style="italic">era pensato per stare in alto</text>
<rect x="18" y="540" width="274" height="150" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="30" cy="552" r="10" fill="#185FA5"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="552" text-anchor="middle" dominant-baseline="central">7</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#0C447C" x="155" y="576" text-anchor="middle" dominant-baseline="central">IL DAVID DI MARMO</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="155" y="598" text-anchor="middle" dominant-baseline="central">1408-1409, alto 191 cm,</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="155" y="623" text-anchor="middle" dominant-baseline="central">per il Duomo di Firenze:</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="155" y="648" text-anchor="middle" dominant-baseline="central">posa ancora gotica</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0C447C" x="155" y="673" text-anchor="middle" dominant-baseline="central" font-style="italic">&#xe8; la prima opera di Donatello</text>
<rect x="382" y="540" width="274" height="150" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="394" cy="552" r="10" fill="#993C1D"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="552" text-anchor="middle" dominant-baseline="central">8</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#71130C" x="519" y="576" text-anchor="middle" dominant-baseline="central">DOVE FINISCE</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="598" text-anchor="middle" dominant-baseline="central">dal 1416 a Palazzo Vecchio;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="623" text-anchor="middle" dominant-baseline="central">oggi al Bargello,</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="648" text-anchor="middle" dominant-baseline="central">come quello di bronzo</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#712B13" x="519" y="673" text-anchor="middle" dominant-baseline="central" font-style="italic">Bargello = Museo Nazionale</text>
<rect x="746" y="540" width="274" height="150" rx="8" fill="#FCF0F0" stroke="#C04040" stroke-width="1.5"/>
<circle cx="758" cy="552" r="10" fill="#C04040"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="552" text-anchor="middle" dominant-baseline="central">9</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#7A1010" x="883" y="576" text-anchor="middle" dominant-baseline="central">ERRORI COMUNI</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="598" text-anchor="middle" dominant-baseline="central">bronzo e marmo sono uguali (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="623" text-anchor="middle" dominant-baseline="central">David vestito da guerriero (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="648" text-anchor="middle" dominant-baseline="central">testa sotto il piede &#xe8; di David (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#7A1010" x="883" y="673" text-anchor="middle" dominant-baseline="central" font-style="italic">il bronzo &#xe8; nel Duomo (✗)</text>
<rect x="18" y="702" width="1004" height="80" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="#5F5E5A" x="34" y="718" text-anchor="start" dominant-baseline="central">Connessioni chiave</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="736" text-anchor="start" dominant-baseline="central">&#x2192; Segui i riquadri in ordine, da 1 a 9: &#xe8; un unico racconto, non percorsi diversi.</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="752" text-anchor="start" dominant-baseline="central">&#x2192; Il David di bronzo (1): forse per i Medici (2), nudo con cappello e stivali (3), piede su Golia (4).</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="768" text-anchor="start" dominant-baseline="central">&#x2192; È il primo nudo a tutto tondo dall&#x2019;antichit&#xe0; (6); il David di marmo (7) &#xe8; ancora gotico; dove finisce (8). Infine gli errori (9).</text>
