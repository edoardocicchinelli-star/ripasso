<text font-family="Arial" font-size="13" font-weight="700" fill="#0C447C" x="519" y="520" text-anchor="middle" dominant-baseline="central">IL TEMPO</text>

<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="652" text-anchor="start" dominant-baseline="central">&#x2192; Segui i riquadri in ordine, da 1 a 9: &#xe8; un unico racconto, non percorsi diversi.</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="668" text-anchor="start" dominant-baseline="central">&#x2192; Annullabile per incapacit&#xe0; (2) o per un vizio del consenso (3): errore (4), violenza (5), dolo (6).</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="684" text-anchor="start" dominant-baseline="central">&#x2192; L&#x2019;azione di annullamento si prescrive in cinque anni (8), che partono da momenti diversi (9).</text>
