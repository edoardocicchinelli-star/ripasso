<text font-family="Arial" font-size="18" font-weight="700" fill="#26215C" x="520" y="42" text-anchor="middle" dominant-baseline="central">LA RACCOLTA</text>
<text font-family="Arial" font-size="12" font-weight="normal" fill="#534AB7" x="520" y="65" text-anchor="middle" dominant-baseline="central">la strategia di sopravvivenza pi&#xf9; antica</text>
<rect x="18" y="144" width="274" height="122" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="30" cy="156" r="10" fill="#993C1D"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="156" text-anchor="middle" dominant-baseline="central">1</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#71130C" x="155" y="180" text-anchor="middle" dominant-baseline="central">LA SAVANA AFRICANA</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="202" text-anchor="middle" dominant-baseline="central">probabile ambiente della raccolta</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="227" text-anchor="middle" dominant-baseline="central">nella preistoria; ha due stagioni:</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#712B13" x="155" y="252" text-anchor="middle" dominant-baseline="central" font-style="italic">umida e secca</text>
<rect x="382" y="144" width="274" height="122" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<circle cx="394" cy="156" r="10" fill="#3B6D11"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="156" text-anchor="middle" dominant-baseline="central">2</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#173404" x="519" y="180" text-anchor="middle" dominant-baseline="central">STAGIONE UMIDA</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="202" text-anchor="middle" dominant-baseline="central">tanti vegetali commestibili:</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="227" text-anchor="middle" dominant-baseline="central">germogli di graminacee,</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#27500A" x="519" y="252" text-anchor="middle" dominant-baseline="central" font-style="italic">fiori, foglie e frutti</text>
<rect x="746" y="144" width="274" height="122" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<circle cx="758" cy="156" r="10" fill="#0F6E56"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="156" text-anchor="middle" dominant-baseline="central">3</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#04342C" x="883" y="180" text-anchor="middle" dominant-baseline="central">STAGIONE SECCA</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="202" text-anchor="middle" dominant-baseline="central">poche piante: si scava con</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="227" text-anchor="middle" dominant-baseline="central">un bastone da scavo</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#085041" x="883" y="252" text-anchor="middle" dominant-baseline="central" font-style="italic">per trovare radici ricche d&#x2019;acqua</text>
<rect x="746" y="314" width="274" height="122" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="758" cy="326" r="10" fill="#185FA5"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="326" text-anchor="middle" dominant-baseline="central">4</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#0C447C" x="883" y="350" text-anchor="middle" dominant-baseline="central">LE CARCASSE</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="883" y="372" text-anchor="middle" dominant-baseline="central">carcasse di antilopi, zebre, gnu</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="883" y="397" text-anchor="middle" dominant-baseline="central">uccise dai felini (leoni, leopardi):</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0C447C" x="883" y="422" text-anchor="middle" dominant-baseline="central" font-style="italic">dopo i felini, prima degli sciacalli</text>
<rect x="382" y="314" width="274" height="122" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1.5"/>
<circle cx="394" cy="326" r="10" fill="#993556"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="326" text-anchor="middle" dominant-baseline="central">5</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#4B1528" x="519" y="350" text-anchor="middle" dominant-baseline="central">STRATEGIA OPPORTUNISTICA</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="372" text-anchor="middle" dominant-baseline="central">si prende carne e midollo</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="397" text-anchor="middle" dominant-baseline="central">dalle carcasse: variante</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#72243E" x="519" y="422" text-anchor="middle" dominant-baseline="central" font-style="italic">della raccolta, non &#xe8; caccia</text>
<rect x="18" y="314" width="274" height="122" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
<circle cx="30" cy="326" r="10" fill="#854F0B"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="326" text-anchor="middle" dominant-baseline="central">6</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#412402" x="155" y="350" text-anchor="middle" dominant-baseline="central">UN ESSERE ONNIVORO</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="372" text-anchor="middle" dominant-baseline="central">predatore di piccoli animali,</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="397" text-anchor="middle" dominant-baseline="central">competitore degli erbivori,</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#633806" x="155" y="422" text-anchor="middle" dominant-baseline="central" font-style="italic">preda dei feroci carnivori</text>
<rect x="18" y="484" width="274" height="122" rx="8" fill="#FCF0F0" stroke="#C04040" stroke-width="1.5"/>
<circle cx="30" cy="496" r="10" fill="#C04040"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="496" text-anchor="middle" dominant-baseline="central">7</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#7A1010" x="155" y="520" text-anchor="middle" dominant-baseline="central">ERRORI COMUNI</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="155" y="542" text-anchor="middle" dominant-baseline="central">carcassa = caccia (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="155" y="567" text-anchor="middle" dominant-baseline="central">raccolta fatta dagli uomini (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#7A1010" x="155" y="592" text-anchor="middle" dominant-baseline="central" font-style="italic">raccolta = solo frutti (✗)</text>
