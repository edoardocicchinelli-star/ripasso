<rect x="226" y="20" width="588" height="56" rx="10" fill="#EEE9FC" stroke="#534AB7" stroke-width="2"/>
<text font-family="Arial" font-size="18" font-weight="700" fill="#26215C" x="520" y="42" text-anchor="middle" dominant-baseline="central">CHARLES I, 1625-1649</text>
<text font-family="Arial" font-size="12" font-weight="normal" fill="#534AB7" x="520" y="65" text-anchor="middle" dominant-baseline="central">Crown against Parliament</text>
<rect x="18" y="144" width="274" height="150" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="30" cy="156" r="10" fill="#993C1D"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="156" text-anchor="middle" dominant-baseline="central">1</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#71130C" x="155" y="180" text-anchor="middle" dominant-baseline="central">DIVINE RIGHT</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="202" text-anchor="middle" dominant-baseline="central">kings chosen by God, his</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="227" text-anchor="middle" dominant-baseline="central">representatives on Earth;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="252" text-anchor="middle" dominant-baseline="central">absolute power;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#712B13" x="155" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">total obedience expected</text>
<rect x="382" y="144" width="274" height="150" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<circle cx="394" cy="156" r="10" fill="#3B6D11"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="156" text-anchor="middle" dominant-baseline="central">2</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#173404" x="519" y="180" text-anchor="middle" dominant-baseline="central">TAXES AND CHURCH</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="202" text-anchor="middle" dominant-baseline="central">taxes raised without the</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="227" text-anchor="middle" dominant-baseline="central">consent of Parliament;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="252" text-anchor="middle" dominant-baseline="central">absolute obedience to the</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#27500A" x="519" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">Church of England</text>
<rect x="746" y="144" width="274" height="150" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<circle cx="758" cy="156" r="10" fill="#0F6E56"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="156" text-anchor="middle" dominant-baseline="central">3</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#04342C" x="883" y="180" text-anchor="middle" dominant-baseline="central">PETITION OF RIGHT</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="202" text-anchor="middle" dominant-baseline="central">1628: money for the war with</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="227" text-anchor="middle" dominant-baseline="central">France only if the king accepts:</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="252" text-anchor="middle" dominant-baseline="central">no taxes without Parliament;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#085041" x="883" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">no prison without a good reason</text>
<rect x="746" y="342" width="274" height="150" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="758" cy="354" r="10" fill="#185FA5"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="354" text-anchor="middle" dominant-baseline="central">4</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#0C447C" x="883" y="378" text-anchor="middle" dominant-baseline="central">WILLIAM LAUD</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="883" y="400" text-anchor="middle" dominant-baseline="central">Archbishop of Canterbury;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="883" y="425" text-anchor="middle" dominant-baseline="central">High Church worship; persecutes</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="883" y="450" text-anchor="middle" dominant-baseline="central">the Puritans (thousands go to</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0C447C" x="883" y="475" text-anchor="middle" dominant-baseline="central" font-style="italic">America); later executed</text>
<rect x="382" y="342" width="274" height="150" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1.5"/>
<circle cx="394" cy="354" r="10" fill="#993556"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="354" text-anchor="middle" dominant-baseline="central">5</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#4B1528" x="519" y="378" text-anchor="middle" dominant-baseline="central">PERSONAL RULE</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="400" text-anchor="middle" dominant-baseline="central">1629: disagreements get worse;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="425" text-anchor="middle" dominant-baseline="central">Charles shuts Parliament and</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="450" text-anchor="middle" dominant-baseline="central">rules as a despot for</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#72243E" x="519" y="475" text-anchor="middle" dominant-baseline="central" font-style="italic">11 years (until 1640)</text>
<rect x="18" y="342" width="274" height="150" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
<circle cx="30" cy="354" r="10" fill="#854F0B"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="354" text-anchor="middle" dominant-baseline="central">6</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#412402" x="155" y="378" text-anchor="middle" dominant-baseline="central">THE 1640 PARLIAMENTS</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="400" text-anchor="middle" dominant-baseline="central">1640: money for a war with Scotland;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="425" text-anchor="middle" dominant-baseline="central">Short Parliament: a month; then</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="450" text-anchor="middle" dominant-baseline="central">Long Parliament: refuses funds,</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#633806" x="155" y="475" text-anchor="middle" dominant-baseline="central" font-style="italic">aims to reduce the king&#x2019;s power</text>
<rect x="18" y="540" width="274" height="150" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="30" cy="552" r="10" fill="#185FA5"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="552" text-anchor="middle" dominant-baseline="central">7</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#0C447C" x="155" y="576" text-anchor="middle" dominant-baseline="central">CIVIL WAR 1642-49</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="155" y="598" text-anchor="middle" dominant-baseline="central">Royalists (king, Anglican nobles)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="155" y="623" text-anchor="middle" dominant-baseline="central">v Roundheads (Parliament,</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="155" y="648" text-anchor="middle" dominant-baseline="central">Puritans, middle class);</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0C447C" x="155" y="673" text-anchor="middle" dominant-baseline="central" font-style="italic">Ironsides win Marston Moor, Naseby</text>
<rect x="382" y="540" width="274" height="150" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="394" cy="552" r="10" fill="#993C1D"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="552" text-anchor="middle" dominant-baseline="central">8</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#71130C" x="519" y="576" text-anchor="middle" dominant-baseline="central">1649</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="598" text-anchor="middle" dominant-baseline="central">the king refuses to recognise</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="623" text-anchor="middle" dominant-baseline="central">the court; Cromwell has the</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="648" text-anchor="middle" dominant-baseline="central">death warrant signed;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#712B13" x="519" y="673" text-anchor="middle" dominant-baseline="central" font-style="italic">beheaded in January 1649</text>
<rect x="746" y="540" width="274" height="150" rx="8" fill="#FCF0F0" stroke="#C04040" stroke-width="1.5"/>
<circle cx="758" cy="552" r="10" fill="#C04040"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="552" text-anchor="middle" dominant-baseline="central">9</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#7A1010" x="883" y="576" text-anchor="middle" dominant-baseline="central">COMMON MISTAKES</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="598" text-anchor="middle" dominant-baseline="central">Royalists = Puritans (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="623" text-anchor="middle" dominant-baseline="central">Short = Long Parliament (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="648" text-anchor="middle" dominant-baseline="central">1628 = 1629 (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#7A1010" x="883" y="673" text-anchor="middle" dominant-baseline="central" font-style="italic">king executed after Cromwell (✗)</text>
<rect x="18" y="702" width="1004" height="96" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="#5F5E5A" x="34" y="718" text-anchor="start" dominant-baseline="central">Connessioni chiave</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="736" text-anchor="start" dominant-baseline="central">&#x2192; Segui i riquadri in ordine, da 1 a 9: &#xe8; un unico racconto, non percorsi diversi.</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="752" text-anchor="start" dominant-baseline="central">&#x2192; The king (1) wants power and taxes without Parliament (2); Laud (4) helps him.</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="768" text-anchor="start" dominant-baseline="central">&#x2192; After 11 years alone (5), the Long Parliament (6) goes against him.</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="784" text-anchor="start" dominant-baseline="central">&#x2192; The Civil War (7) ends with the king beheaded in January 1649 (8). Last, the common mistakes (9).</text>
</svg>
