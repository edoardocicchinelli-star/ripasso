<text font-family="Arial" font-size="18" font-weight="700" fill="#26215C" x="520" y="42" text-anchor="middle" dominant-baseline="central">TOMMASO D&#x2019;AQUINO</text>
<text font-family="Arial" font-size="12" font-weight="normal" fill="#534AB7" x="520" y="65" text-anchor="middle" dominant-baseline="central">vita, opere e rapporto fede-ragione</text>
<rect x="18" y="144" width="274" height="150" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="30" cy="156" r="10" fill="#993C1D"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="156" text-anchor="middle" dominant-baseline="central">1</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#71130C" x="155" y="180" text-anchor="middle" dominant-baseline="central">LA VITA</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="202" text-anchor="middle" dominant-baseline="central">Roccasecca 1224-25; Montecassino;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="227" text-anchor="middle" dominant-baseline="central">Napoli (1239); domenicano nel 1244;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="252" text-anchor="middle" dominant-baseline="central">Parigi e Colonia con Alberto Magno;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#712B13" x="155" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">maestro di teologia a Parigi (1256)</text>
<rect x="382" y="144" width="274" height="150" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<circle cx="394" cy="156" r="10" fill="#3B6D11"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="156" text-anchor="middle" dominant-baseline="central">2</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#173404" x="519" y="180" text-anchor="middle" dominant-baseline="central">GLI ULTIMI ANNI</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="202" text-anchor="middle" dominant-baseline="central">Curia (1259-1268); Parigi (1269-72);</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="227" text-anchor="middle" dominant-baseline="central">Napoli (1272-74); muore a Fossanova</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="252" text-anchor="middle" dominant-baseline="central">il 7 marzo 1274, andando al Concilio</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#27500A" x="519" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">di Lione; santo nel 1323</text>
<rect x="746" y="144" width="274" height="150" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<circle cx="758" cy="156" r="10" fill="#0F6E56"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="156" text-anchor="middle" dominant-baseline="central">3</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#04342C" x="883" y="180" text-anchor="middle" dominant-baseline="central">LE OPERE</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="202" text-anchor="middle" dominant-baseline="central">Summa theologiae (1265-1273, incompiuta);</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="227" text-anchor="middle" dominant-baseline="central">Summa contra Gentiles; De ente et</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="252" text-anchor="middle" dominant-baseline="central">essentia; Quaestiones disputatae;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#085041" x="883" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">commenti ad Aristotele</text>
<rect x="746" y="342" width="274" height="150" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="758" cy="354" r="10" fill="#185FA5"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="354" text-anchor="middle" dominant-baseline="central">4</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#0C447C" x="883" y="378" text-anchor="middle" dominant-baseline="central">LA SUMMA</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="883" y="400" text-anchor="middle" dominant-baseline="central">metodo della quaestio; tre parti:</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="883" y="425" text-anchor="middle" dominant-baseline="central">Dio, l&#x2019;uomo e la felicit&#xe0;, Cristo;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0C447C" x="883" y="450" text-anchor="middle" dominant-baseline="central" font-style="italic">usa Aristotele ma non lo ripete</text>
<rect x="382" y="342" width="274" height="150" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1.5"/>
<circle cx="394" cy="354" r="10" fill="#993556"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="354" text-anchor="middle" dominant-baseline="central">5</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#4B1528" x="519" y="378" text-anchor="middle" dominant-baseline="central">FEDE E RAGIONE</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="400" text-anchor="middle" dominant-baseline="central">distinte: natura e soprannatura;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="425" text-anchor="middle" dominant-baseline="central">la filosofia ha principi propri;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="450" text-anchor="middle" dominant-baseline="central">le verit&#xe0; rivelate si accettano</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#72243E" x="519" y="475" text-anchor="middle" dominant-baseline="central" font-style="italic">con la fede</text>
<rect x="18" y="342" width="274" height="150" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
<circle cx="30" cy="354" r="10" fill="#854F0B"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="354" text-anchor="middle" dominant-baseline="central">6</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#412402" x="155" y="378" text-anchor="middle" dominant-baseline="central">PREAMBOLI DELLA FEDE</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="400" text-anchor="middle" dominant-baseline="central">verit&#xe0; dimostrabili con la ragione:</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="425" text-anchor="middle" dominant-baseline="central">esistenza di Dio, immortalit&#xe0;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="450" text-anchor="middle" dominant-baseline="central">dell&#x2019;anima; preparano la fede;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#633806" x="155" y="475" text-anchor="middle" dominant-baseline="central" font-style="italic">la filosofia serve a formulare i dogmi</text>
<rect x="18" y="540" width="274" height="150" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="30" cy="552" r="10" fill="#185FA5"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="552" text-anchor="middle" dominant-baseline="central">7</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#0C447C" x="155" y="576" text-anchor="middle" dominant-baseline="central">LA TEOLOGIA</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="155" y="598" text-anchor="middle" dominant-baseline="central">&#xe8; una scienza (teoria di Aristotele);</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="155" y="623" text-anchor="middle" dominant-baseline="central">principi: gli articoli di fede,</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="155" y="648" text-anchor="middle" dominant-baseline="central">veri perch&#xe9; rivelati da Dio;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0C447C" x="155" y="673" text-anchor="middle" dominant-baseline="central" font-style="italic">forte distacco da Agostino</text>
<rect x="382" y="540" width="274" height="150" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="394" cy="552" r="10" fill="#993C1D"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="552" text-anchor="middle" dominant-baseline="central">8</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#71130C" x="519" y="576" text-anchor="middle" dominant-baseline="central">CONTRO GLI AVERROISTI</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="598" text-anchor="middle" dominant-baseline="central">De unitate intellectus (1270): contro</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="623" text-anchor="middle" dominant-baseline="central">gli averroisti (intelletto unico);</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="648" text-anchor="middle" dominant-baseline="central">si difende anche dai maestri agostiniani,</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#712B13" x="519" y="673" text-anchor="middle" dominant-baseline="central" font-style="italic">diffidenti verso il suo aristotelismo</text>
<rect x="746" y="540" width="274" height="150" rx="8" fill="#FCF0F0" stroke="#C04040" stroke-width="1.5"/>
<circle cx="758" cy="552" r="10" fill="#C04040"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="552" text-anchor="middle" dominant-baseline="central">9</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#7A1010" x="883" y="576" text-anchor="middle" dominant-baseline="central">ERRORI COMUNI</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="598" text-anchor="middle" dominant-baseline="central">Tommaso francescano (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="623" text-anchor="middle" dominant-baseline="central">morto nel 1349 (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="648" text-anchor="middle" dominant-baseline="central">la Trinit&#xe0; si dimostra (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#7A1010" x="883" y="673" text-anchor="middle" dominant-baseline="central" font-style="italic">fede e ragione in contrasto (✗)</text>
<rect x="18" y="702" width="1004" height="80" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="#5F5E5A" x="34" y="718" text-anchor="start" dominant-baseline="central">Connessioni chiave</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="736" text-anchor="start" dominant-baseline="central">&#x2192; Segui i riquadri in ordine, da 1 a 9: &#xe8; un unico racconto, non percorsi diversi.</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="752" text-anchor="start" dominant-baseline="central">&#x2192; La vita (1) e gli ultimi anni (2); le opere (3) e la Summa (4). Fede e ragione (5): i preamboli della fede (6).</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="768" text-anchor="start" dominant-baseline="central">&#x2192; La teologia come scienza (7); contro gli averroisti (8). Infine gli errori comuni (9).</text>
</svg>
