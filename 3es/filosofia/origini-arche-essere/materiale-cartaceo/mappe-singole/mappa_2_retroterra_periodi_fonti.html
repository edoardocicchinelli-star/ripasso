<text font-family="Arial" font-size="13" font-weight="700" fill="#71130C" x="176" y="180" text-anchor="middle" dominant-baseline="central">COSMOLOGIE MITICHE</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="176" y="202" text-anchor="middle" dominant-baseline="central">miti che narrano</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="176" y="227" text-anchor="middle" dominant-baseline="central">l&#x2019;origine e la vita</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#712B13" x="176" y="252" text-anchor="middle" dominant-baseline="central" font-style="italic">del cosmo, prima della filosofia</text>

<circle cx="374" cy="156" r="10" fill="#3B6D11"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="374" y="156" text-anchor="middle" dominant-baseline="central">2</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#173404" x="520" y="180" text-anchor="middle" dominant-baseline="central">RELIGIONI MISTERICHE</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="520" y="202" text-anchor="middle" dominant-baseline="central">in particolare l&#x2019;orfismo:</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="520" y="227" text-anchor="middle" dominant-baseline="central">il pensiero come forma</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#27500A" x="520" y="252" text-anchor="middle" dominant-baseline="central" font-style="italic">di vita autentica, non solo rito</text>
<rect x="706" y="144" width="316" height="122" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<circle cx="718" cy="156" r="10" fill="#0F6E56"/>

<text font-family="Arial" font-size="13" font-weight="700" fill="#04342C" x="864" y="180" text-anchor="middle" dominant-baseline="central">RIFLESSIONE DEI POETI</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="864" y="202" text-anchor="middle" dominant-baseline="central">etico-politica (Omero, Esiodo);</text>

<text font-family="Arial" font-size="11" font-weight="normal" fill="#085041" x="864" y="252" text-anchor="middle" dominant-baseline="central" font-style="italic">fondamentali per interpretare il mondo</text>

<text font-family="Arial" font-size="13" font-weight="700" fill="#7A1010" x="176" y="520" text-anchor="middle" dominant-baseline="central">ERRORI COMUNI</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="176" y="542" text-anchor="middle" dominant-baseline="central">periodi = tre (✗)</text>

<circle cx="374" cy="496" r="10" fill="#185FA5"/>

<text font-family="Arial" font-size="13" font-weight="700" fill="#0C447C" x="520" y="520" text-anchor="middle" dominant-baseline="central">TESTIMONIANZE</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="520" y="542" text-anchor="middle" dominant-baseline="central">opere di Platone</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="520" y="567" text-anchor="middle" dominant-baseline="central">e Aristotele, che citano</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0C447C" x="520" y="592" text-anchor="middle" dominant-baseline="central" font-style="italic">e commentano i filosofi precedenti</text>
<rect x="706" y="484" width="316" height="122" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="718" cy="496" r="10" fill="#993C1D"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="718" y="496" text-anchor="middle" dominant-baseline="central">9</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#71130C" x="864" y="520" text-anchor="middle" dominant-baseline="central">DOSSOGRAFIE</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="864" y="542" text-anchor="middle" dominant-baseline="central">raccolte di dottrine</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="864" y="567" text-anchor="middle" dominant-baseline="central">scritte nella tarda antichit&#xe0;,</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#712B13" x="864" y="592" text-anchor="middle" dominant-baseline="central" font-style="italic">per esempio da Diogene Laerzio</text>
<rect x="18" y="618" width="1004" height="80" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="#5F5E5A" x="34" y="634" text-anchor="start" dominant-baseline="central">Connessioni chiave</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="652" text-anchor="start" dominant-baseline="central">&#x2192; Il retroterra comprende le cosmologie mitiche (1), l&#x2019;orfismo (2) e i poeti (3).</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="668" text-anchor="start" dominant-baseline="central">&#x2192; I periodi sono cinque (4, 5): dal cosmologico al religioso.</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="684" text-anchor="start" dominant-baseline="central">&#x2192; Le fonti (6) sono le opere dei filosofi, le testimonianze di Platone e Aristotele e le dossografie (8, 9).</text>
