<text font-family="Arial" font-size="13" font-weight="700" fill="#71130C" x="116" y="180" text-anchor="middle" dominant-baseline="central">LINES 1-4</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="116" y="202" text-anchor="middle" dominant-baseline="central">the Geats build a pyre;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="116" y="227" text-anchor="middle" dominant-baseline="central">armour, helmet, shield</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#712B13" x="116" y="252" text-anchor="middle" dominant-baseline="central" font-style="italic">symbols of heroic status</text>

<text font-family="Arial" font-size="13" font-weight="700" fill="#173404" x="340" y="180" text-anchor="middle" dominant-baseline="central">THE PASSAGE</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="340" y="202" text-anchor="middle" dominant-baseline="central">Seamus Heaney&#x2019;s</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="340" y="227" text-anchor="middle" dominant-baseline="central">translation of a typical</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#27500A" x="340" y="252" text-anchor="middle" dominant-baseline="central" font-style="italic">Anglo-Saxon funeral</text>

<text font-family="Arial" font-size="13" font-weight="700" fill="#04342C" x="564" y="180" text-anchor="middle" dominant-baseline="central">LINES 14-19</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="564" y="202" text-anchor="middle" dominant-baseline="central">a Geat woman sings:</text>

<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="340" y="372" text-anchor="middle" dominant-baseline="central">jewels and ornaments</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="340" y="397" text-anchor="middle" dominant-baseline="central">are buried; money is</text>
