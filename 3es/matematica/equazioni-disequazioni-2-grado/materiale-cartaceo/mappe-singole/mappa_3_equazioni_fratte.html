<text font-family="Arial" font-size="13" font-weight="700" fill="#71130C" x="155" y="180" text-anchor="middle" dominant-baseline="central">EQUAZIONE FRATTA</text>
<text font-family="Arial" font-size="10" font-weight="normal" fill="#993C1D" x="141.2" y="196" text-anchor="middle" dominant-baseline="central">N(x)</text>

<text font-family="Arial" font-size="10" font-weight="normal" fill="#993C1D" x="141.2" y="209" text-anchor="middle" dominant-baseline="central">D(x)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155.2" y="202" text-anchor="start" dominant-baseline="central"> = 0;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="227" text-anchor="middle" dominant-baseline="central">la x compare al denominatore;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="252" text-anchor="middle" dominant-baseline="central">N(x) = numeratore,</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#712B13" x="155" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">D(x) = denominatore</text>

<circle cx="394" cy="156" r="10" fill="#3B6D11"/>

<text font-family="Arial" font-size="13" font-weight="700" fill="#173404" x="519" y="180" text-anchor="middle" dominant-baseline="central">1. C.E.</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="202" text-anchor="middle" dominant-baseline="central">poni D(x) &#x2260; 0:</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="227" text-anchor="middle" dominant-baseline="central">ogni denominatore diverso da zero;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="252" text-anchor="middle" dominant-baseline="central">es.: x − 2 &#x2260; 0 &#x2192; x &#x2260; 2;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#27500A" x="519" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">si scrivono per prime</text>

<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="450" text-anchor="middle" dominant-baseline="central">il denominatore sarebbe 0:</text>

<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="752" text-anchor="start" dominant-baseline="central">&#x2192; Equazione fratta (1): prima le C.E. (2), poi il numeratore (3), infine la verifica (4).</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="768" text-anchor="start" dominant-baseline="central">&#x2192; Soluzione scartata (5) e finale (6); esempi (7-8). Infine gli errori (9).</text>
