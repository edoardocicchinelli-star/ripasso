<text font-family="Arial" font-size="18" font-weight="700" fill="#26215C" x="520" y="42" text-anchor="middle" dominant-baseline="central">EQUAZIONI DI 2° GRADO INTERE</text>
<text font-family="Arial" font-size="12" font-weight="normal" fill="#534AB7" x="520" y="65" text-anchor="middle" dominant-baseline="central">forma normale, Δ e formula risolutiva</text>
<rect x="18" y="144" width="274" height="150" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="30" cy="156" r="10" fill="#993C1D"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="156" text-anchor="middle" dominant-baseline="central">1</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#71130C" x="155" y="180" text-anchor="middle" dominant-baseline="central">FORMA NORMALE</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="202" text-anchor="middle" dominant-baseline="central">ax² + bx + c = 0 (a &#x2260; 0);</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="227" text-anchor="middle" dominant-baseline="central">tutto a sinistra, 0 a destra;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="252" text-anchor="middle" dominant-baseline="central">a: coefficiente di x²; b: di x;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#712B13" x="155" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">c: termine noto (senza x)</text>
<rect x="382" y="144" width="274" height="150" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<circle cx="394" cy="156" r="10" fill="#3B6D11"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="156" text-anchor="middle" dominant-baseline="central">2</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#173404" x="519" y="180" text-anchor="middle" dominant-baseline="central">SCRIVI a, b, c</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="202" text-anchor="middle" dominant-baseline="central">prendili con il loro segno;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="227" text-anchor="middle" dominant-baseline="central">se manca un termine,</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="252" text-anchor="middle" dominant-baseline="central">quel numero vale 0;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#27500A" x="519" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">x² − 5x + 6 &#x2192; 1, −5, 6</text>
<rect x="746" y="144" width="274" height="150" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<circle cx="758" cy="156" r="10" fill="#0F6E56"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="156" text-anchor="middle" dominant-baseline="central">3</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#04342C" x="883" y="180" text-anchor="middle" dominant-baseline="central">CALCOLA Δ</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="202" text-anchor="middle" dominant-baseline="central">Δ = b² − 4·a·c;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="227" text-anchor="middle" dominant-baseline="central">fallo a pezzi:</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="252" text-anchor="middle" dominant-baseline="central">prima b², poi 4·a·c,</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#085041" x="883" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">poi sottrai</text>
<rect x="746" y="342" width="274" height="150" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="758" cy="354" r="10" fill="#185FA5"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="354" text-anchor="middle" dominant-baseline="central">4</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#0C447C" x="883" y="378" text-anchor="middle" dominant-baseline="central">GUARDA IL SEGNO DI Δ</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="883" y="400" text-anchor="middle" dominant-baseline="central">Δ &gt; 0: due soluzioni distinte</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="883" y="425" text-anchor="middle" dominant-baseline="central">Δ = 0: due soluzioni coincidenti</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="883" y="450" text-anchor="middle" dominant-baseline="central">Δ &lt; 0: nessuna soluzione reale</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0C447C" x="883" y="475" text-anchor="middle" dominant-baseline="central" font-style="italic">(con Δ &lt; 0 ti fermi)</text>
<rect x="382" y="342" width="274" height="150" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1.5"/>
<circle cx="394" cy="354" r="10" fill="#993556"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="354" text-anchor="middle" dominant-baseline="central">5</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#4B1528" x="519" y="378" text-anchor="middle" dominant-baseline="central">LA FORMULA</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="486.5" y="400" text-anchor="start" dominant-baseline="central">x = </text>
<text font-family="Arial" font-size="10" font-weight="normal" fill="#993556" x="530.0" y="394" text-anchor="middle" dominant-baseline="central">−b ± √Δ</text>
<line x1="510.5" y1="400.5" x2="549.5" y2="400.5" stroke="#993556" stroke-width="1"/>
<text font-family="Arial" font-size="10" font-weight="normal" fill="#993556" x="530.0" y="407" text-anchor="middle" dominant-baseline="central">2a</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="425" text-anchor="middle" dominant-baseline="central">con il + una soluzione,</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#72243E" x="519" y="450" text-anchor="middle" dominant-baseline="central" font-style="italic">con il − l&#x2019;altra</text>
<rect x="18" y="342" width="274" height="150" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
<circle cx="30" cy="354" r="10" fill="#854F0B"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="354" text-anchor="middle" dominant-baseline="central">6</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#412402" x="155" y="378" text-anchor="middle" dominant-baseline="central">QUANDO Δ = 0</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="118.5" y="400" text-anchor="start" dominant-baseline="central">x₁ = x₂ = </text>
<text font-family="Arial" font-size="10" font-weight="normal" fill="#854F0B" x="182.5" y="394" text-anchor="middle" dominant-baseline="central">−b</text>
<line x1="175.5" y1="400.5" x2="189.5" y2="400.5" stroke="#854F0B" stroke-width="1"/>
<text font-family="Arial" font-size="10" font-weight="normal" fill="#854F0B" x="182.5" y="407" text-anchor="middle" dominant-baseline="central">2a</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="425" text-anchor="middle" dominant-baseline="central">una soluzione sola (doppia);</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="450" text-anchor="middle" dominant-baseline="central">x² − 4x + 4 = 0</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#633806" x="155" y="475" text-anchor="middle" dominant-baseline="central" font-style="italic">&#x2192; x = 2</text>
<rect x="18" y="540" width="274" height="150" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="30" cy="552" r="10" fill="#185FA5"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="552" text-anchor="middle" dominant-baseline="central">7</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#0C447C" x="155" y="576" text-anchor="middle" dominant-baseline="central">ESEMPIO: Δ &gt; 0</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="155" y="598" text-anchor="middle" dominant-baseline="central">x² − 5x + 6 = 0: a=1, b=−5, c=6</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="155" y="623" text-anchor="middle" dominant-baseline="central">Δ = 25 − 24 = 1; √1 = 1</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="113.8" y="648" text-anchor="start" dominant-baseline="central">x₁ = </text>
<text font-family="Arial" font-size="10" font-weight="normal" fill="#185FA5" x="157.8" y="642" text-anchor="middle" dominant-baseline="central">5 − 1</text>
<line x1="143.2" y1="648.5" x2="172.2" y2="648.5" stroke="#185FA5" stroke-width="1"/>
<text font-family="Arial" font-size="10" font-weight="normal" fill="#185FA5" x="157.8" y="655" text-anchor="middle" dominant-baseline="central">2</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="174.2" y="648" text-anchor="start" dominant-baseline="central"> = 2</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0C447C" x="113.8" y="673" text-anchor="start" dominant-baseline="central" font-style="italic">x₂ = </text>
<text font-family="Arial" font-size="10" font-weight="normal" fill="#0C447C" x="157.8" y="667" text-anchor="middle" dominant-baseline="central" font-style="italic">5 + 1</text>
<line x1="143.2" y1="673.5" x2="172.2" y2="673.5" stroke="#0C447C" stroke-width="1"/>
<text font-family="Arial" font-size="10" font-weight="normal" fill="#0C447C" x="157.8" y="680" text-anchor="middle" dominant-baseline="central" font-style="italic">2</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0C447C" x="174.2" y="673" text-anchor="start" dominant-baseline="central" font-style="italic"> = 3</text>
<rect x="382" y="540" width="274" height="150" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="394" cy="552" r="10" fill="#993C1D"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="552" text-anchor="middle" dominant-baseline="central">8</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#71130C" x="519" y="576" text-anchor="middle" dominant-baseline="central">ESEMPIO: Δ &lt; 0</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="598" text-anchor="middle" dominant-baseline="central">x² + 2x + 5 = 0: a=1, b=2, c=5</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="623" text-anchor="middle" dominant-baseline="central">Δ = 4 − 20 = −16</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="648" text-anchor="middle" dominant-baseline="central">Δ negativo: niente radice:</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#712B13" x="519" y="673" text-anchor="middle" dominant-baseline="central" font-style="italic">nessuna soluzione reale</text>
<rect x="746" y="540" width="274" height="150" rx="8" fill="#FCF0F0" stroke="#C04040" stroke-width="1.5"/>
<circle cx="758" cy="552" r="10" fill="#C04040"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="552" text-anchor="middle" dominant-baseline="central">9</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#7A1010" x="883" y="576" text-anchor="middle" dominant-baseline="central">ERRORI COMUNI</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="598" text-anchor="middle" dominant-baseline="central">(−5)² = −25 (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="623" text-anchor="middle" dominant-baseline="central">divido solo un pezzo per 2a (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="648" text-anchor="middle" dominant-baseline="central">con Δ &lt; 0 continuo a calcolare (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#7A1010" x="883" y="673" text-anchor="middle" dominant-baseline="central" font-style="italic">non porto in forma normale (✗)</text>
<rect x="18" y="702" width="1004" height="80" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="#5F5E5A" x="34" y="718" text-anchor="start" dominant-baseline="central">Connessioni chiave</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="736" text-anchor="start" dominant-baseline="central">&#x2192; Segui i riquadri in ordine, da 1 a 9: &#xe8; un unico racconto, non percorsi diversi.</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="752" text-anchor="start" dominant-baseline="central">&#x2192; Forma normale (1), poi a, b, c (2) e Δ (3); il segno di Δ (4) dice quante soluzioni ci sono.</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="768" text-anchor="start" dominant-baseline="central">&#x2192; La formula (5), il caso Δ = 0 (6) e due esempi (7-8). Infine gli errori (9).</text>
