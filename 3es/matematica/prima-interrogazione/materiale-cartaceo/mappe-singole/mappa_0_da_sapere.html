<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="202" text-anchor="middle" dominant-baseline="central">3(x + 2) = 3x + 6</text>

<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="598" text-anchor="middle" dominant-baseline="central">1² = 1 · 2² = 4 · 3² = 9</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="623" text-anchor="middle" dominant-baseline="central">4² = 16 · 5² = 25 · 6² = 36</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="648" text-anchor="middle" dominant-baseline="central">7² = 49 · 8² = 64 · 9² = 81</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#712B13" x="519" y="673" text-anchor="middle" dominant-baseline="central" font-style="italic">10² = 100 · 11² = 121 · 12² = 144</text>
<rect x="746" y="540" width="274" height="150" rx="8" fill="#FCF0F0" stroke="#C04040" stroke-width="1.5"/>
<circle cx="758" cy="552" r="10" fill="#C04040"/>

<text font-family="Arial" font-size="13" font-weight="700" fill="#7A1010" x="883" y="576" text-anchor="middle" dominant-baseline="central">ERRORI COMUNI</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="598" text-anchor="middle" dominant-baseline="central">(−5)² scritto −25</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="623" text-anchor="middle" dominant-baseline="central">perdo il segno di lato</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#7A1010" x="883" y="648" text-anchor="middle" dominant-baseline="central" font-style="italic">controllo ogni segno</text>
<rect x="18" y="702" width="1004" height="112" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="#5F5E5A" x="34" y="718" text-anchor="start" dominant-baseline="central">Connessioni chiave</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="736" text-anchor="start" dominant-baseline="central">&#x2192; Segui i riquadri in ordine, da 1 a 9: &#xe8; un unico racconto, non percorsi diversi.</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="752" text-anchor="start" dominant-baseline="central">&#x2192; Segni (1) e parentesi (2) si usano insieme: −(x − 5) cambia tutti i segni. Quadrati (3) e radice (4) sono operazioni</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="768" text-anchor="start" dominant-baseline="central">inverse.</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="784" text-anchor="start" dominant-baseline="central">&#x2192; Il m.c.m. (5) e passare di lato (6) servono a risolvere le equazioni; poi il controllo (7) e i quadrati da conoscere (8).</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="800" text-anchor="start" dominant-baseline="central">Infine gli errori (9).</text>
