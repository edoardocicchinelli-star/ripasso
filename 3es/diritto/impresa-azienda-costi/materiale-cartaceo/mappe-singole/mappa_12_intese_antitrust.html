<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="701" y="615" text-anchor="middle" dominant-baseline="central">errori:</text>
<rect x="226" y="20" width="588" height="56" rx="10" fill="#EEE9FC" stroke="#534AB7" stroke-width="2"/>
<text font-family="Arial" font-size="18" font-weight="700" fill="#26215C" x="520" y="42" text-anchor="middle" dominant-baseline="central">INTESE TRA IMPRESE E ANTITRUST</text>
<text font-family="Arial" font-size="12" font-weight="normal" fill="#534AB7" x="520" y="65" text-anchor="middle" dominant-baseline="central">cartelli, consorzi, trust, legge 287/1990</text>
<rect x="18" y="144" width="274" height="150" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="30" cy="156" r="10" fill="#993C1D"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="156" text-anchor="middle" dominant-baseline="central">1</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#71130C" x="155" y="180" text-anchor="middle" dominant-baseline="central">LE INTESE TRA IMPRESE</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="202" text-anchor="middle" dominant-baseline="central">le imprese possono accordarsi:</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="227" text-anchor="middle" dominant-baseline="central">cartelli, consorzi, trust;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="252" text-anchor="middle" dominant-baseline="central">se limitano la concorrenza</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#712B13" x="155" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">sono un rischio per i consumatori</text>
<rect x="382" y="144" width="274" height="150" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1.5"/>
<circle cx="394" cy="156" r="10" fill="#3B6D11"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="156" text-anchor="middle" dominant-baseline="central">2</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#173404" x="519" y="180" text-anchor="middle" dominant-baseline="central">CARTELLO</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="202" text-anchor="middle" dominant-baseline="central">accordo tra imprese concorrenti:</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="227" text-anchor="middle" dominant-baseline="central">fissano i prezzi, limitano la</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="252" text-anchor="middle" dominant-baseline="central">produzione o si dividono i mercati;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#27500A" x="519" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">vietato se limita la concorrenza</text>
<rect x="746" y="144" width="274" height="150" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<circle cx="758" cy="156" r="10" fill="#0F6E56"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="156" text-anchor="middle" dominant-baseline="central">3</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#04342C" x="883" y="180" text-anchor="middle" dominant-baseline="central">CONSORZIO (ART. 2602)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="202" text-anchor="middle" dominant-baseline="central">pi&#xf9; imprenditori istituiscono</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="227" text-anchor="middle" dominant-baseline="central">un&#x2019;organizzazione comune per svolgere</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="252" text-anchor="middle" dominant-baseline="central">alcune fasi delle loro imprese;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#085041" x="883" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">ogni impresa resta indipendente</text>
<rect x="746" y="342" width="274" height="150" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="758" cy="354" r="10" fill="#185FA5"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="354" text-anchor="middle" dominant-baseline="central">4</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#0C447C" x="883" y="378" text-anchor="middle" dominant-baseline="central">TRUST</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="883" y="400" text-anchor="middle" dominant-baseline="central">pi&#xf9; imprese concorrenti sotto una</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="883" y="425" text-anchor="middle" dominant-baseline="central">direzione unica; esempio storico:</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="883" y="450" text-anchor="middle" dominant-baseline="central">la Standard Oil (USA);</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0C447C" x="883" y="475" text-anchor="middle" dominant-baseline="central" font-style="italic">Sherman Act (USA, 1890): contro i trust</text>
<rect x="382" y="342" width="274" height="150" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1.5"/>
<circle cx="394" cy="354" r="10" fill="#993556"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="354" text-anchor="middle" dominant-baseline="central">5</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#4B1528" x="519" y="378" text-anchor="middle" dominant-baseline="central">LEGGE 287 DEL 1990</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="400" text-anchor="middle" dominant-baseline="central">&#xe8; la normativa antitrust italiana;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="425" text-anchor="middle" dominant-baseline="central">tutela l&#x2019;iniziativa economica</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="450" text-anchor="middle" dominant-baseline="central">(art. 41 Cost.); vieta intese,</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#72243E" x="519" y="475" text-anchor="middle" dominant-baseline="central" font-style="italic">abusi e controlla concentrazioni</text>
<rect x="18" y="342" width="274" height="150" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1.5"/>
<circle cx="30" cy="354" r="10" fill="#854F0B"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="354" text-anchor="middle" dominant-baseline="central">6</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#412402" x="155" y="378" text-anchor="middle" dominant-baseline="central">INTESE VIETATE (ART. 2)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="400" text-anchor="middle" dominant-baseline="central">sono nulle se limitano in modo</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="425" text-anchor="middle" dominant-baseline="central">consistente la concorrenza:</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="450" text-anchor="middle" dominant-baseline="central">fissare prezzi, limitare produzione</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#633806" x="155" y="475" text-anchor="middle" dominant-baseline="central" font-style="italic">o accesso, dividere i mercati</text>
<rect x="18" y="540" width="274" height="150" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<circle cx="30" cy="552" r="10" fill="#185FA5"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="552" text-anchor="middle" dominant-baseline="central">7</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#0C447C" x="155" y="576" text-anchor="middle" dominant-baseline="central">ABUSO E CONCENTRAZIONI</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="155" y="598" text-anchor="middle" dominant-baseline="central">la posizione dominante non &#xe8; vietata:</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="155" y="623" text-anchor="middle" dominant-baseline="central">lo &#xe8; l&#x2019;abuso (art. 3); concentrazioni</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="155" y="648" text-anchor="middle" dominant-baseline="central">(art. 5): fusione, acquisto del</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0C447C" x="155" y="673" text-anchor="middle" dominant-baseline="central" font-style="italic">controllo, impresa comune</text>
<rect x="382" y="540" width="274" height="150" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="394" cy="552" r="10" fill="#993C1D"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="552" text-anchor="middle" dominant-baseline="central">8</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#71130C" x="519" y="576" text-anchor="middle" dominant-baseline="central">L&#x2019;AGCM</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="598" text-anchor="middle" dominant-baseline="central">Autorit&#xe0; garante della concorrenza</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="623" text-anchor="middle" dominant-baseline="central">e del mercato: indipendente, a Roma;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="648" text-anchor="middle" dominant-baseline="central">presidente e 4 componenti (7 anni);</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#712B13" x="519" y="673" text-anchor="middle" dominant-baseline="central" font-style="italic">sanzioni fino al 10% del fatturato</text>
<rect x="746" y="540" width="274" height="150" rx="8" fill="#FCF0F0" stroke="#C04040" stroke-width="1.5"/>
<circle cx="758" cy="552" r="10" fill="#C04040"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="552" text-anchor="middle" dominant-baseline="central">9</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#7A1010" x="883" y="576" text-anchor="middle" dominant-baseline="central">ERRORI COMUNI</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="598" text-anchor="middle" dominant-baseline="central">posizione dominante = vietata (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="623" text-anchor="middle" dominant-baseline="central">consorzio = sempre cartello (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="648" text-anchor="middle" dominant-baseline="central">legge antitrust = art. 41 (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#7A1010" x="883" y="673" text-anchor="middle" dominant-baseline="central" font-style="italic">AGCM = societ&#xe0; privata (✗)</text>
<rect x="18" y="702" width="1004" height="80" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="#5F5E5A" x="34" y="718" text-anchor="start" dominant-baseline="central">Connessioni chiave</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="736" text-anchor="start" dominant-baseline="central">&#x2192; Segui i riquadri in ordine, da 1 a 9: &#xe8; un unico racconto, non percorsi diversi.</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="752" text-anchor="start" dominant-baseline="central">&#x2192; Le intese (1) sono cartelli (2), consorzi (3) e trust (4). La legge 287 del 1990 (5) vieta le intese restrittive (6).</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="768" text-anchor="start" dominant-baseline="central">&#x2192; Vieta l&#x2019;abuso di posizione dominante e controlla le concentrazioni (7); la fa rispettare l&#x2019;AGCM (8). Infine gli errori comuni (9).</text>
</svg>
