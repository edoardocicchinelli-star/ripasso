<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="652" text-anchor="start" dominant-baseline="central">&#x2192; Segui i riquadri in ordine, da 1 a 9: &#xe8; un unico racconto, non percorsi diversi.</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="668" text-anchor="start" dominant-baseline="central">&#x2192; Gano (3) tradisce; Orlando, Oliviero e Turpino guidano la retroguardia a Roncisvalle (4).</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="684" text-anchor="start" dominant-baseline="central">&#x2192; Per orgoglio Orlando aspetta a suonare l&#x2019;olifante (5) e muore da eroe con Durlindana (6); Carlo Magno torna e condanna Gano (8-9).</text>
