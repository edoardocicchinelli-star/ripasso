<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="156" text-anchor="middle" dominant-baseline="central">1</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#71130C" x="155" y="180" text-anchor="middle" dominant-baseline="central">NEOEVOLUZIONISMO</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="202" text-anchor="middle" dominant-baseline="central">cerca processi generali</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="155" y="227" text-anchor="middle" dominant-baseline="central">di cambiamento</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#712B13" x="155" y="252" text-anchor="middle" dominant-baseline="central" font-style="italic">reazione al particolarismo</text>

<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="156" text-anchor="middle" dominant-baseline="central">2</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#173404" x="519" y="180" text-anchor="middle" dominant-baseline="central">I TRE ESPONENTI</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="202" text-anchor="middle" dominant-baseline="central">Childe, White, Steward</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="227" text-anchor="middle" dominant-baseline="central">Childe: sistema produttivo</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#3B6D11" x="519" y="252" text-anchor="middle" dominant-baseline="central">White: tecnologia</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#27500A" x="519" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">Steward: ambienti diversi</text>
<rect x="746" y="144" width="274" height="150" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.5"/>
<circle cx="758" cy="156" r="10" fill="#0F6E56"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="156" text-anchor="middle" dominant-baseline="central">3</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#04342C" x="883" y="180" text-anchor="middle" dominant-baseline="central">GORDON CHILDE (1892-1957)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="202" text-anchor="middle" dominant-baseline="central">evoluzione legata al sistema</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="227" text-anchor="middle" dominant-baseline="central">produttivo: 3 fasi</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0F6E56" x="883" y="252" text-anchor="middle" dominant-baseline="central">Paleolitico, Neolitico, civilt&#xe0;</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#085041" x="883" y="277" text-anchor="middle" dominant-baseline="central" font-style="italic">Man Makes Himself (1936)</text>

<text font-family="Arial" font-size="13" font-weight="700" fill="#0C447C" x="883" y="378" text-anchor="middle" dominant-baseline="central">RIVOLUZIONE NEOLITICA</text>

<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="883" y="450" text-anchor="middle" dominant-baseline="central">surplus, citt&#xe0;, Stato</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0C447C" x="883" y="475" text-anchor="middle" dominant-baseline="central" font-style="italic">stratificazione sociale (classi diverse)</text>
<rect x="382" y="342" width="274" height="150" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1.5"/>

<text font-family="Arial" font-size="13" font-weight="700" fill="#4B1528" x="519" y="378" text-anchor="middle" dominant-baseline="central">LESLIE WHITE (1900-1975)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="400" text-anchor="middle" dominant-baseline="central">la tecnologia determina l&#x2019;uso</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="425" text-anchor="middle" dominant-baseline="central">di energia e di risorse</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993556" x="519" y="450" text-anchor="middle" dominant-baseline="central">la cultura evolve quando aumenta</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#72243E" x="519" y="475" text-anchor="middle" dominant-baseline="central" font-style="italic">l&#x2019;energia usata per persona</text>

<circle cx="30" cy="354" r="10" fill="#854F0B"/>

<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="400" text-anchor="middle" dominant-baseline="central">tecnologico, sociologico,</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="425" text-anchor="middle" dominant-baseline="central">ideologico: il tecnologico</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#854F0B" x="155" y="450" text-anchor="middle" dominant-baseline="central">&#xe8; la base</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#633806" x="155" y="475" text-anchor="middle" dominant-baseline="central" font-style="italic">e influenza gli altri due</text>

<circle cx="30" cy="552" r="10" fill="#185FA5"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="30" y="552" text-anchor="middle" dominant-baseline="central">7</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#0C447C" x="155" y="576" text-anchor="middle" dominant-baseline="central">JULIAN STEWARD (1902-1972)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="155" y="598" text-anchor="middle" dominant-baseline="central">critica un&#x2019;unica evoluzione</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="155" y="623" text-anchor="middle" dominant-baseline="central">universale: ambienti diversi</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#185FA5" x="155" y="648" text-anchor="middle" dominant-baseline="central">danno percorsi diversi</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#0C447C" x="155" y="673" text-anchor="middle" dominant-baseline="central" font-style="italic">Theory of Culture Change (1955)</text>
<rect x="382" y="540" width="274" height="150" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="1.5"/>
<circle cx="394" cy="552" r="10" fill="#993C1D"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="394" y="552" text-anchor="middle" dominant-baseline="central">8</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#71130C" x="519" y="576" text-anchor="middle" dominant-baseline="central">EVOLUZIONE MULTILINEARE</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="598" text-anchor="middle" dominant-baseline="central">pi&#xf9; percorsi di cambiamento</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="623" text-anchor="middle" dominant-baseline="central">e adattamento culturale</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#993C1D" x="519" y="648" text-anchor="middle" dominant-baseline="central">contro un&#x2019;unica evoluzione universale</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#712B13" x="519" y="673" text-anchor="middle" dominant-baseline="central" font-style="italic">ambienti diversi, percorsi diversi</text>
<rect x="746" y="540" width="274" height="150" rx="8" fill="#FCF0F0" stroke="#C04040" stroke-width="1.5"/>
<circle cx="758" cy="552" r="10" fill="#C04040"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="white" x="758" y="552" text-anchor="middle" dominant-baseline="central">9</text>
<text font-family="Arial" font-size="13" font-weight="700" fill="#7A1010" x="883" y="576" text-anchor="middle" dominant-baseline="central">ERRORI COMUNI</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="598" text-anchor="middle" dominant-baseline="central">Childe = tecnologia ed energia (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="623" text-anchor="middle" dominant-baseline="central">Steward: un solo cammino (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#C04040" x="883" y="648" text-anchor="middle" dominant-baseline="central">3 fasi: selvaggia, barbarie (✗)</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#7A1010" x="883" y="673" text-anchor="middle" dominant-baseline="central" font-style="italic">White = evoluzione multilineare (✗)</text>
<rect x="18" y="702" width="1004" height="80" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text font-family="Arial" font-size="11" font-weight="700" fill="#5F5E5A" x="34" y="718" text-anchor="start" dominant-baseline="central">Connessioni chiave</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="736" text-anchor="start" dominant-baseline="central">&#x2192; Segui i riquadri in ordine, da 1 a 9: &#xe8; un unico racconto, non percorsi diversi.</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="752" text-anchor="start" dominant-baseline="central">&#x2192; Il neoevoluzionismo (1) ha tre esponenti (2): Childe (3) con la rivoluzione neolitica (4); White (5) con i tre sistemi (6).</text>
<text font-family="Arial" font-size="11" font-weight="normal" fill="#444441" x="34" y="768" text-anchor="start" dominant-baseline="central">&#x2192; Steward (7) critica l&#x2019;evoluzione universale e parla di evoluzione multilineare (8). Infine gli errori (9).</text>
